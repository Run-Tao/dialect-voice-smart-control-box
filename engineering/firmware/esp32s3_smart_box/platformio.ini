; DialectVoice ESP32-S3 execution firmware
;
; 默认使用原生 USB CDC，对应板载标有 USB 的口。
; 如果电脑只能通过 UART 桥接口看到串口，请使用 esp32-s3-uart 环境。

[platformio]
default_envs = esp32-s3-usb

[env:esp32-s3-usb]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D DV_LIGHT_PIN=4
  -D DV_CURTAIN_SERVO_PIN=5
  -D DV_STATUS_LED_PIN=6
  -D DV_LIGHT_ACTIVE_HIGH=1
  -D DV_SERVO_OPEN_ANGLE=90
  -D DV_SERVO_CLOSE_ANGLE=0

[env:esp32-s3-uart]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D DV_LIGHT_PIN=4
  -D DV_CURTAIN_SERVO_PIN=5
  -D DV_STATUS_LED_PIN=6
  -D DV_LIGHT_ACTIVE_HIGH=1
  -D DV_SERVO_OPEN_ANGLE=90
  -D DV_SERVO_CLOSE_ANGLE=0
